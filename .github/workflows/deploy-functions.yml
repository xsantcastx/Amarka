name: Deploy Firebase Cloud Functions

on:
  # Trigger on push to main branch when functions directory changes
  push:
    branches:
      - main
    paths:
      - 'functions/**'
  
  # Allow manual workflow dispatch from GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloud Functions to Firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout repository code
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Install dependencies
        working-directory: ./functions
        run: npm ci
      
      - name: Build functions
        working-directory: ./functions
        run: npm run build
      
      # The ssr function serves the app shell, so this deploy needs the built
      # server bundle (firebase.json predeploy copies dist/... into functions/ssr).
      - name: Install app dependencies
        run: npm ci

      - name: Build app (SSR server bundle)
        run: npm run build

      # Authenticate with the same service account the hosting workflow uses.
      # This previously used `--token "$FIREBASE_TOKEN"`, but that secret is
      # empty, so every run since 2026-07-12 failed at this step with
      # "Failed to authenticate, have you run firebase login?" — after having
      # already spent the full build. `firebase login:ci` tokens are also
      # deprecated and removed in firebase-tools v14+, so restoring the token
      # would only have bought time. FIREBASE_SERVICE_ACCOUNT_AMARKA_D237B is
      # known-good: firebase-hosting-merge.yml deploys with it successfully.
      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMARKA_D237B }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_AMARKA_D237B is empty or unset."
            echo "Add the service account JSON under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase deploy --only functions --project amarka-d237b --non-interactive

      - name: Remove service account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Cloud Functions deployed successfully!"
          echo "Key functions: ssr, submitStudioEnquiry, submitTradeApplication, sendBrevoEmail"
