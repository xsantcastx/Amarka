name: Deploy Firebase Cloud Functions

on:
  # The SSR function also depends on the app, generated brand config and rules.
  push:
    branches:
      - main
    paths:
      - 'functions/**'
      - 'src/**'
      - 'public/**'
      - 'config/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'angular.json'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'firebase.json'
      - 'storage.rules'
      - '.env.example'
      - '.github/workflows/deploy-functions.yml'
  
  # Allow manual workflow dispatch from GitHub UI
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Cloud Functions to Firebase
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Required to checkout repository code
    # Match Hosting's build environment so dynamic SSR pages use the same brand.
    env:
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_AUTH_DOMAIN: amarka-d237b.firebaseapp.com
      FIREBASE_PROJECT_ID: amarka-d237b
      FIREBASE_STORAGE_BUCKET: amarka-d237b.firebasestorage.app
      FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_MEASUREMENT_ID: G-XQHZR0DS09
      GA_MEASUREMENT_ID: G-XQHZR0DS09
      GTM_CONTAINER_ID: ""
      STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}
      RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
      RECAPTCHA_ENABLED: "true"
      APPCHECK_PROVIDER: recaptcha
      APPCHECK_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
      USE_FIREBASE_EMULATORS: "false"
      APP_NAME: Amarka
      APP_URL: https://amarka.co
      APP_BRAND_KEY: amarka
      FUNCTIONS_NAMESPACE: amarka
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'
      
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      
      - name: Install dependencies
        working-directory: ./functions
        run: npm ci
      
      - name: Build functions
        working-directory: ./functions
        run: npm run build
      
      # The ssr function serves the app shell, so this deploy needs the built
      # server bundle (firebase.json predeploy copies dist/... into functions/ssr).
      - name: Install app dependencies
        run: npm ci

      - name: Build app (SSR server bundle)
        run: npm run build

      # Authenticate with the same service account the hosting workflow uses.
      # This previously used `--token "$FIREBASE_TOKEN"`, but that secret is
      # empty, so every run since 2026-07-12 failed at this step with
      # "Failed to authenticate, have you run firebase login?" — after having
      # already spent the full build. `firebase login:ci` tokens are also
      # deprecated and removed in firebase-tools v14+, so restoring the token
      # would only have bought time. FIREBASE_SERVICE_ACCOUNT_AMARKA_D237B is
      # known-good: firebase-hosting-merge.yml deploys with it successfully.
      - name: Deploy to Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AMARKA_D237B }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_AMARKA_D237B is empty or unset."
            echo "Add the service account JSON under Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          firebase deploy --only functions,storage --project amarka-d237b --non-interactive

      - name: Remove service account credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"

      - name: Deployment summary
        if: success()
        run: |
          echo "✅ Cloud Functions and Storage rules deployed successfully!"
          echo "Key functions: ssr, submitStudioEnquiry, submitTradeApplication, sendBrevoEmail"
