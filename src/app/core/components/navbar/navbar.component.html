<header class="site-nav" [class.site-nav--scrolled]="scrolled()" [attr.data-theme]="theme()" amarkaSmartStickyNav>
  <div class="site-nav__inner">
    <!-- Brand -->
    <a routerLink="/" class="site-nav__brand navbar-logo" aria-label="Amarka home">
      <img [src]="logoSrc()" [alt]="logoAlt" class="site-nav__logo"
           width="1376" height="455" loading="eager" decoding="async" />
      <span class="site-nav__tag">{{ tagline }}</span>
    </a>

    <!-- Desktop links (only rendered once pages exist to link to) -->
    @if (navLinks.length) {
    <nav class="site-nav__links" aria-label="Primary navigation">
      @for (link of navLinks; track link.href) {
      <a [routerLink]="link.href"
         routerLinkActive="is-active"
         [routerLinkActiveOptions]="{ exact: !!link.exact }">
        {{ link.label }}
      </a>
      }
    </nav>
    }

    <a routerLink="/enquire" class="amk-btn amk-btn--primary site-nav__cta navbar-cta">
      <span>Get a Free Quote</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>
</header>
