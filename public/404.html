<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#14110D">
    <title>Page Not Found · Amarka</title>
    <meta name="description" content="The page you're looking for has moved. Visit Amarka — corporate merchandise, engraving & brand solutions, Miami, FL.">
    <meta name="robots" content="noindex">

    <!--
      Firebase Hosting fallback 404. Rendered only if a request misses both
      Angular's SSR function and its client-side router (direct asset miss,
      malformed CDN path, etc.) — in production, firebase.json routes "**" to
      the SSR function, so this file is a last-resort static fallback, not
      the primary 404 experience (see NotFoundPageComponent for that).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

    <style media="screen">
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #14110D;
        color: #F5EEDD;
        font-family: 'Hanken Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.5;
      }
      .amarka-fallback {
        max-width: 480px;
        width: 100%;
        margin: 0 auto;
        padding: 48px 32px;
        text-align: center;
      }
      .amarka-fallback__brand {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(245, 238, 221, 0.68);
        margin: 0 0 24px;
      }
      .amarka-fallback__rule {
        width: 64px;
        height: 1px;
        background: #C9A24C;
        border: none;
        margin: 0 auto 32px;
      }
      .amarka-fallback__code {
        font-family: 'Hanken Grotesk', sans-serif;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #FF7A52;
        margin: 0 0 12px;
      }
      .amarka-fallback__heading {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 600;
        font-size: 32px;
        line-height: 1.2;
        color: #F5EEDD;
        margin: 0 0 16px;
      }
      .amarka-fallback__lede {
        font-size: 16px;
        color: rgba(245, 238, 221, 0.68);
        margin: 0 0 32px;
      }
      .amarka-fallback__cta {
        display: inline-block;
        padding: 14px 28px;
        background: linear-gradient(135deg, #E8C877, #C9A24C);
        color: #14110D;
        font-family: 'Hanken Grotesk', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 999px;
        min-height: 48px;
        line-height: 20px;
      }
      .amarka-fallback__cta:hover {
        background: linear-gradient(135deg, #F3E3B4, #E8C877);
      }
      .amarka-fallback__cta:focus-visible {
        outline: 2px solid #C9A24C;
        outline-offset: 2px;
      }
      .amarka-fallback__contact {
        margin: 32px 0 0;
        font-size: 13px;
        color: rgba(245, 238, 221, 0.45);
      }
      .amarka-fallback__contact a {
        color: rgba(245, 238, 221, 0.68);
        text-decoration: none;
        border-bottom: 1px solid rgba(245, 238, 221, 0.16);
      }
      .amarka-fallback__contact a:hover,
      .amarka-fallback__contact a:focus {
        color: #F5EEDD;
        border-bottom-color: #C9A24C;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="amarka-fallback" role="main">
      <p class="amarka-fallback__brand">Amarka</p>
      <hr class="amarka-fallback__rule" aria-hidden="true">
      <p class="amarka-fallback__code">Error 404</p>
      <h1 class="amarka-fallback__heading">This page isn't here.</h1>
      <p class="amarka-fallback__lede">
        The page you're looking for has moved. Head back home and we'll help you find what you need.
      </p>
      <a class="amarka-fallback__cta" href="/">Back to Amarka</a>
      <p class="amarka-fallback__contact">
        Need to reach us? <a href="mailto:diego@amarka.co">diego@amarka.co</a> · Miami, FL
      </p>
    </main>
  </body>
</html>
