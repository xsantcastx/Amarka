<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181818">
    <title>Page Not Found · Amarka</title>
    <meta name="description" content="The page you're looking for isn't in the studio. Visit Amarka — bespoke laser engraving in Stamford, CT.">
    <meta name="robots" content="noindex">

    <!--
      Firebase Hosting fallback 404. Rendered when a request misses Angular's
      router (direct asset miss, malformed CDN path, etc.). Mirrors the Brand
      Bible 6-token palette from src/styles.scss:
        #181818 amarka-bg | #484848 amarka-surface | #906030 amarka-gold
        #f0f0f0 amarka-text | #c0c0c0 amarka-text-secondary | #909090 amarka-text-muted
      Stamford, CT positioning. Contacts: diego@amarka.co / jessica@amarka.co.
      Proactive Brand Bible audit follow-up to AMK-68/70/71/76/77/78.
    -->
    <style media="screen">
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #181818;
        color: #f0f0f0;
        font-family: 'Source Sans 3', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        line-height: 1.5;
      }
      .amarka-fallback {
        max-width: 480px;
        width: 100%;
        margin: 0 auto;
        padding: 48px 32px;
        text-align: center;
      }
      .amarka-fallback__brand {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: 14px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #c0c0c0;
        margin: 0 0 24px;
      }
      .amarka-fallback__rule {
        width: 64px;
        height: 1px;
        background: #906030;
        border: none;
        margin: 0 auto 32px;
      }
      .amarka-fallback__code {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #906030;
        margin: 0 0 12px;
      }
      .amarka-fallback__heading {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 600;
        font-size: 32px;
        line-height: 1.2;
        color: #f0f0f0;
        margin: 0 0 16px;
      }
      .amarka-fallback__lede {
        font-size: 16px;
        color: #c0c0c0;
        margin: 0 0 32px;
      }
      .amarka-fallback__cta {
        display: inline-block;
        padding: 14px 28px;
        background: #906030;
        color: #f0f0f0;
        font-family: 'Source Sans 3', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        text-decoration: none;
        border-radius: 2px;
        min-height: 48px;
        line-height: 20px;
      }
      .amarka-fallback__cta:hover {
        /* AMK-53 micro-interaction spec: darken primary 10% on hover via color-mix
           — keeps everything in the 6-token palette, no new hex literal. */
        background: color-mix(in srgb, #906030 85%, #181818 15%);
      }
      .amarka-fallback__cta:focus-visible {
        outline: 2px solid #906030;
        outline-offset: 2px;
      }
      .amarka-fallback__contact {
        margin: 32px 0 0;
        font-size: 13px;
        color: #909090;
      }
      .amarka-fallback__contact a {
        color: #c0c0c0;
        text-decoration: none;
        border-bottom: 1px solid #484848;
      }
      .amarka-fallback__contact a:hover,
      .amarka-fallback__contact a:focus {
        color: #f0f0f0;
        border-bottom-color: #906030;
      }
      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <main class="amarka-fallback" role="main">
      <p class="amarka-fallback__brand">Amarka</p>
      <hr class="amarka-fallback__rule" aria-hidden="true">
      <p class="amarka-fallback__code">Error 404</p>
      <h1 class="amarka-fallback__heading">This piece isn't in the studio.</h1>
      <p class="amarka-fallback__lede">
        The page you're looking for has moved or is no longer available. Head back to the studio and we'll help you find it.
      </p>
      <a class="amarka-fallback__cta" href="/">Back to Amarka</a>
      <p class="amarka-fallback__contact">
        Need to reach us? <a href="mailto:diego@amarka.co">diego@amarka.co</a> · Stamford, CT
      </p>
    </main>
  </body>
</html>
